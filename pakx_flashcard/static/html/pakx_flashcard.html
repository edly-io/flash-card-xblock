<div class="pakx_flashcard_block">
    <h2 class="flashcard-title">{{ self.display_name }}</h2>
    <p class="flashcard-lead"{% if not self.description %} hidden{% endif %}>{{ self.description }}</p>
    <div class="flashcard_wrapper">
        {% for card in self.cards %}
        {{ card | safe }}
        {% endfor %}
    </div>
    <nav class="fc-nav" aria-label="Card navigation">
        <button type="button" class="fc-btn-prev" aria-label="Previous card" disabled></button>
        <div class="fc-nav-center">
            <div class="flashcard-dots" aria-hidden="true"></div>
            <p class="flashcard-count" aria-live="polite"></p>
        </div>
        <button type="button" class="fc-btn-next" aria-label="Next card"></button>
    </nav>
</div>
