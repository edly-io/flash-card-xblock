<!-- TODO: Replace by default edit view once available in Studio -->
{% with usage_id=self.scope_ids.usage_id %}
<div class="wrapper-comp-settings is-active editor-with-buttons google-edit-wrapper" id="{{usage_id}}-document-settings-tab" data-usage-id="{{usage_id}}">
  <script type="text/html" data-name="input-template">
    <li class="field comp-setting-entry is-set">
      <div class="static-buttons">
        <span class="action-buttons hide">
          <button class="static-buttons two-images">2 Images</button>
          <button class="static-buttons image-paragraph">Image Paragraph</button>
          <button class="static-buttons paragraph-image">Paragraph Image</button>
          <button class="static-buttons two-paragraph">2 Paragraphs</button>
        </span>
        <button class="static-buttons del-button">Delete Card</button>
      </div>
      <div class="wrapper-comp-setting">
        <span class="tip setting-help"></span>
        <div class='codemirror-editor-wrapper'>
          <textarea class="block-xml-editor edit-data" name="editor"></textarea>
        </div>
      </div>
    </li>
  </script>

  <script type="text/html" data-name="images-script">
    <div class="flip">
      <div class="card">
        <div class="front"><div><img src="http://placehold.it/300x300" alt=""></div></div>
        <div class="back"><img src="http://placehold.it/500x500" alt=""> </div>
      </div>
    </div>
  </script>

  <script type="text/html" data-name="para-image-script">
    <div class="flip">
      <div class="card">
        <div class="front"><div>Flip Card Image Flip Card Image</div></div>
        <div class="back"><div><img src="http://placehold.it/300x300" alt=""></div></div>
      </div>
    </div>
  </script>

  <script type="text/html" data-name="image-para-script">
    <div class="flip">
      <div class="card">
        <div class="front"><div><img src="http://placehold.it/300x300" alt=""></div></div>
        <div class="back"><div>Flip Card Image Flip Card Image</div></div>
      </div>
    </div>
  </script>

  <script type="text/html" data-name="two-para-script">
    <div class="flip">
      <div class="card">
        <div class="front"><div>Flip Card Front</div></div>
          <div class="back">
              <div>
                  <h1>What is Lorem Ipsum?</h1>
                  <p>Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen book. It has survived not only five centuries, but also the leap into electronic typesetting, remaining essentially unchanged. It was popularised in the 1960s with the release of Letraset sheets containing Lorem Ipsum passages, and more recently with desktop publishing software like Aldus PageMaker including versions of Lorem Ipsum.</p>
              </div>
          </div>
      </div>
    </div>
  </script>

  <form id="{{usage_id}}-form"></form>
  <div class="user-inputs-and-validation">
    <div class="xblock-inputs editor_content_wrapper">
      <ul class="list-input settings-list" id="{{usage_id}}-ul">
        <li class="field comp-setting-entry is-set">
          <div class="wrapper-comp-setting">
            <label class="label setting-label" for="edit_display_name">Display Name</label>
            <input class="input setting-input edit-display-name" id="edit_display_name" value="{{ self.display_name }}" type="text" data-default-value="{{self.display_name}}">
          </div>
          <span class="tip setting-help">This name appears in the horizontal navigation at the top of the page.</span>
        </li>
      </ul>
    </div>
  </div>
  <div class="xblock-actions">
    <span class="xblock-editor-error-message"></span>
    <ul>
      <li class="action-item">
        <button class="button action-primary add-slide-button">Add Card</button>
      </li>
      <li class="action-item">
        <button form="{{usage_id}}-form" class="button action-primary save-button">Save</button>
      </li>

      <li class="action-item">
        <button class="button cancel-button" id="cancel_button">Cancel</button>
      </li>
    </ul>
  </div>
</div>
{% endwith %}
